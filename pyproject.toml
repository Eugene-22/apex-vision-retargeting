[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-vision-retargeting"
version = "0.1.0"
description = "MediaPipe perception and URDF-based ApexHand retargeting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10.21,<2", "opencv-contrib-python>=4.8,<6"]
test = ["pytest>=8,<10"]

[tool.setuptools]
packages = ["perception", "retargeting", "robot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
